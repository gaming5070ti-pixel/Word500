<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Word500</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    margin: 20px 0;
}

.game {
    width: 95%;
    max-width: 600px;
    margin: auto;
}

.board {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
}

.tile {
    height: 58px;
    background: #333;
    border: 2px solid #555;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 25px;
    font-weight: bold;
}

.green {
    background: #3a9d3a;
    border-color: #3a9d3a;
}

.yellow {
    background: #c9a227;
    border-color: #c9a227;
}

.red {
    background: #b33a3a;
    border-color: #b33a3a;
}

.keyboard {
    margin-top: 20px;
    text-align: center;
}

.key {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    min-width: 35px;
    height: 45px;
    margin: 2px;
    padding: 5px;
    background: #444;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}

.key:hover {
    background: #666;
}

.enter,
.delete {
    padding: 0 12px;
}

.message {
    text-align: center;
    min-height: 30px;
    margin: 15px;
    font-size: 18px;
}

button {
    display: block;
    margin: 15px auto;
    padding: 12px 25px;
    background: #3a9d3a;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>WORD500</h1>

<div class="game">

    <div id="board" class="board"></div>

    <div id="message" class="message"></div>

    <div class="keyboard">

        <div>
            <span class="key" onclick="pressKey('Q')">Q</span>
            <span class="key" onclick="pressKey('W')">W</span>
            <span class="key" onclick="pressKey('E')">E</span>
            <span class="key" onclick="pressKey('R')">R</span>
            <span class="key" onclick="pressKey('T')">T</span>
            <span class="key" onclick="pressKey('Y')">Y</span>
            <span class="key" onclick="pressKey('U')">U</span>
            <span class="key" onclick="pressKey('I')">I</span>
            <span class="key" onclick="pressKey('O')">O</span>
            <span class="key" onclick="pressKey('P')">P</span>
        </div>

        <div>
            <span class="key" onclick="pressKey('A')">A</span>
            <span class="key" onclick="pressKey('S')">S</span>
            <span class="key" onclick="pressKey('D')">D</span>
            <span class="key" onclick="pressKey('F')">F</span>
            <span class="key" onclick="pressKey('G')">G</span>
            <span class="key" onclick="pressKey('H')">H</span>
            <span class="key" onclick="pressKey('J')">J</span>
            <span class="key" onclick="pressKey('K')">K</span>
            <span class="key" onclick="pressKey('L')">L</span>
        </div>

        <div>
            <span class="key" onclick="pressKey('Z')">Z</span>
            <span class="key" onclick="pressKey('X')">X</span>
            <span class="key" onclick="pressKey('C')">C</span>
            <span class="key" onclick="pressKey('V')">V</span>
            <span class="key" onclick="pressKey('B')">B</span>
            <span class="key" onclick="pressKey('N')">N</span>
            <span class="key" onclick="pressKey('M')">M</span>
        </div>

        <div>
            <span class="key delete" onclick="deleteLetter()">⌫</span>
            <span class="key enter" onclick="submitGuess()">ENTER</span>
        </div>

    </div>

    <button onclick="newGame()">NEW GAME</button>

</div>

<script>

const words = [
    "APPLE",
    "HOUSE",
    "WATER",
    "PLANT",
    "WORLD",
    "MOUSE",
    "PHONE",
    "LIGHT",
    "GREEN",
    "BLACK",
    "WHITE",
    "CHAIR",
    "TABLE",
    "BRAIN",
    "HEART",
    "MUSIC",
    "HAPPY",
    "SMILE",
    "BEACH",
    "CLOUD"
];

let secretWord = words[Math.floor(Math.random() * words.length)];

let currentRow = 0;
let currentGuess = "";

const board = document.getElementById("board");
const message = document.getElementById("message");


// Create 8 rows
for (let r = 0; r < 8; r++) {

    const row = document.createElement("div");
    row.className = "row";

    for (let c = 0; c < 5; c++) {

        const tile = document.createElement("div");
        tile.className = "tile";

        tile.id = "tile-" + r + "-" + c;

        row.appendChild(tile);
    }

    board.appendChild(row);
}


// Keyboard button
function pressKey(letter) {

    if (currentGuess.length >= 5) {
        return;
    }

    currentGuess += letter;

    updateBoard();
}


// Delete button
function deleteLetter() {

    currentGuess = currentGuess.slice(0, -1);

    updateBoard();
}


// Update letters on board
function updateBoard() {

    for (let c = 0; c < 5; c++) {

        const tile =
            document.getElementById(
                "tile-" + currentRow + "-" + c
            );

        tile.textContent = currentGuess[c] || "";
    }
}


// Submit guess
function submitGuess() {

    if (currentGuess.length !== 5) {

        message.textContent =
            "You need 5 letters!";

        return;
    }

    checkGuess();

}


// Check the guess
function checkGuess() {

    const guess = currentGuess.toUpperCase();

    for (let i = 0; i < 5; i++) {

        const tile =
            document.getElementById(
                "tile-" + currentRow + "-" + i
            );

        if (guess[i] === secretWord[i]) {

            tile.classList.add("green");

        } else if (secretWord.includes(guess[i])) {

            tile.classList.add("yellow");

        } else {

            tile.classList.add("red");
        }
    }


    if (guess === secretWord) {

        message.textContent =
            "🎉 YOU WIN!";

        return;
    }


    currentRow++;

    currentGuess = "";


    if (currentRow >= 8) {

        message.textContent =
            "Game over! The word was " + secretWord;

        return;
    }

    message.textContent = "";
}


// Physical keyboard
document.addEventListener("keydown", function(event) {

    const key = event.key.toUpperCase();

    if (key === "ENTER") {

        submitGuess();

    } else if (key === "BACKSPACE") {

        deleteLetter();

    } else if (/^[A-Z]$/.test(key)) {

        pressKey(key);
    }

});


// New game
function newGame() {

    location.reload();

}

</script>

</body>
</html>
